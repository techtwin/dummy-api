name: Postman PR Diff

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  postman-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: techtwin/postman-pr-diff@v0.1.3
        with:
          github-token: ${{ github.token }}